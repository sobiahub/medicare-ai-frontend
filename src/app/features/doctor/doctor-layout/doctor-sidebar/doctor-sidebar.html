

@if (isOpen) {

  <button
    type="button"
    aria-label="Close sidebar"
    class="fixed inset-0 z-40 bg-slate-950/40 backdrop-blur-[2px] lg:hidden"
    (click)="closeSidebar()"
  ></button>

}


<!-- SIDEBAR -->

<aside
  class="
    fixed
    inset-y-0
    left-0
    z-50
    flex
    w-[280px]
    flex-col
    bg-white
    shadow-xl
    transition-transform
    duration-300
    ease-out

    lg:static
    lg:h-full
    lg:min-h-full
    lg:w-64
    lg:shrink-0
    lg:translate-x-0
    lg:shadow-none
  "
  [class.translate-x-0]="isOpen"
  [class.-translate-x-full]="!isOpen"
>

  <!-- BRAND -->

  <div
    class="flex h-[76px] shrink-0 items-center justify-between border-b border-slate-100 px-5"
  >

    <!-- Logo -->

    <a
      routerLink="/doctor/dashboard"
      (click)="closeSidebar()"
      class="flex shrink-0 items-center gap-2.5"
    >

      <!-- Logo Icon -->

      <div
        class="
          flex
          h-9
          w-9
          shrink-0
          items-center
          justify-center
          rounded-xl
          bg-[#283779]
          text-white
          shadow-sm
          transition-all
          duration-300
          hover:bg-[#202D61]
          sm:h-10
          sm:w-10
        "
      >

        <i
          class="bi bi-heart-pulse-fill text-[16px] sm:text-[18px]"
        ></i>

      </div>


      <!-- Brand -->

      <div>

        <div
          class="
            text-[15px]
            font-bold
            leading-none
            tracking-tight
            text-slate-900
            sm:text-[17px]
          "
        >
          MediCare
        </div>

        <div
          class="
            mt-1
            text-[7px]
            font-semibold
            uppercase
            tracking-[0.15em]
            text-slate-400
            sm:text-[8px]
          "
        >
          Digital Healthcare
        </div>

      </div>

    </a>


    <!-- Mobile close -->

    <button
      type="button"
      aria-label="Close sidebar"
      class="
        flex
        h-9
        w-9
        items-center
        justify-center
        rounded-lg
        text-slate-400
        transition
        hover:bg-slate-100
        hover:text-slate-700
        lg:hidden
      "
      (click)="closeSidebar()"
    >

      <i class="bi bi-x-lg text-[16px]"></i>

    </button>

  </div>


  <!-- NAVIGATION -->

  <nav
    class="flex-1 overflow-y-auto px-3 py-5 sm:px-4"
  >

    @for (section of navigation; track section.title) {

      <div class="mb-6 last:mb-0">

        <!-- Section title -->

        <div
          class="
            mb-2
            px-3
            text-[10px]
            font-bold
            uppercase
            tracking-[0.12em]
            text-slate-400
          "
        >
          {{ section.title }}
        </div>


        <!-- Items -->

        <div class="space-y-1">

          @for (item of section.items; track item.route) {

            <a
              [routerLink]="item.route"
              routerLinkActive="active-nav"
              [routerLinkActiveOptions]="{ exact: true }"
              (click)="closeSidebar()"
              class="
                group
                flex
                min-h-[44px]
                items-center
                gap-3
                rounded-xl
                px-3
                text-[13px]
                font-medium
                text-slate-600
                transition-all
                duration-200
                hover:bg-slate-50
                hover:text-[#283779]
              "
            >

              <!-- Icon -->

              <span
                class="
                  flex
                  h-8
                  w-8
                  shrink-0
                  items-center
                  justify-center
                  rounded-lg
                  text-slate-400
                  transition-all
                  duration-200
                  group-hover:text-[#283779]
                "
              >

                <i
                  class="{{ item.icon }} text-[17px]"
                ></i>

              </span>


              <!-- Label -->

              <span class="truncate">
                {{ item.label }}
              </span>

            </a>

          }

        </div>

      </div>

    }

  </nav>


  <!-- SIDEBAR BOTTOM -->

  <div
    class="shrink-0 border-t border-slate-100 p-3 sm:p-4"
  >

    <div
      class="
        flex
        items-center
        gap-3
        rounded-xl
        bg-slate-50
        px-3
        py-3
      "
    >

      <!-- Doctor avatar -->

      <div
        class="
          flex
          h-9
          w-9
          shrink-0
          items-center
          justify-center
          rounded-lg
          bg-[#283779]/10
          text-[#283779]
        "
      >

        <i class="bi bi-person-badge text-[17px]"></i>

      </div>


      <!-- Text -->

      <div class="min-w-0">

        <p
          class="
            truncate
            text-xs
            font-semibold
            text-slate-700
          "
        >
          Doctor Panel
        </p>

        <p
          class="
            mt-0.5
            truncate
            text-[10px]
            text-slate-400
          "
        >
          Healthcare Management
        </p>

      </div>

    </div>

  </div>

</aside>
